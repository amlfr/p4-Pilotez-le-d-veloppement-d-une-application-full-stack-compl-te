spring.application.name=datashare-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/datashare
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

# Le schéma est géré manuellement : exécuter db/01-create-database.sql puis
# db/02-schema.sql avant le premier démarrage. validate = l'application vérifie
# le schéma au boot et refuse de démarrer s'il ne correspond pas aux entités.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=false

server.port=8080

# JWT configuration
# NOTE: override jwt.secret in a real environment (env var / external config). Must be >= 32 chars for HS256.
jwt.secret=${JWT_SECRET:datashare-dev-secret-change-me-please-1234567890}
jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# File storage
# Directory the uploaded bytes are written to (created on startup if missing).
datashare.storage.location=./uploads
# Public base URL used to build the download links returned to clients.
datashare.base-url=http://localhost:8080

# US10 — daily purge of expired files. Cron: sec min hour day-of-month month day-of-week.
# Default 03:00 every day; set */20 * * * * * to watch it fire while testing.
datashare.cleanup.cron=0 0 3 * * *