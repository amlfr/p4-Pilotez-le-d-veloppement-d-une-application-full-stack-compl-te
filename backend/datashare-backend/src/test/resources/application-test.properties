# Test profile: in-memory H2 instead of the dev PostgreSQL, so integration tests
# can never touch real data (the US10 purge once deleted dev rows during a run).
spring.datasource.url=jdbc:h2:mem:datashare;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=test-secret-0123456789-0123456789
jwt.expiration-ms=3600000

# Bytes go under target/ (already git-ignored, wiped by mvn clean).
datashare.storage.location=./target/test-uploads
datashare.base-url=http://localhost:8080

# "-" is Spring's CRON_DISABLED: the scheduled purge never fires in tests.
datashare.cleanup.cron=-
